
name: Crear APK de Android ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar JE2BE Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Encontrar proyecto Gradle
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find . -type f -name settings.gradle.kts \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -type f -name settings.gradle \
              -not -path '*/.gradle/*' -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle"
            echo "Contenido del repositorio:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Ejecutar pruebas
        run: gradle -p "$PROJECT_DIR" :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libje2be_jni.so'
          sha256sum "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JE2BE-Android-ARM64-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
