
name: Build MundoIA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        shell: bash
        run: |
          mkdir -p proyecto
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d proyecto

          SETTINGS=$(find proyecto -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS"

          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Corregir Java y Kotlin a JVM 17
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          if not p.exists():
              raise SystemExit(f"No se encontró: {p}")

          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("No se encontró el bloque android en build.gradle.kts")

          java_block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          kotlin_block = """
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  java_block.strip(),
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace("android {", "android {\n" + java_block, 1)

          if re.search(r'kotlinOptions\s*\{', s):
              s = re.sub(
                  r'kotlinOptions\s*\{.*?\}',
                  kotlin_block.strip(),
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace("android {", "android {\n" + kotlin_block, 1)

          p.write_text(s)
          print("Java y Kotlin configurados para JVM 17")
          PY

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar MundoIA
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoIA-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
