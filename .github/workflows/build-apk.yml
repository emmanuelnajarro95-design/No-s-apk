
name: Construir APK JE2BE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Extraer proyecto JE2BE
        shell: bash
        run: |
          set -e

          if [ ! -f "je2be-android-project.zip" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -q je2be-android-project.zip -d extracted-project

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted-project -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Preparar comando Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Primera compilación y descarga de dependencias
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set +e
          $GRADLE_CMD assembleDebug
          RESULT=$?
          set -e

          echo "Primera compilación finalizada con código: $RESULT"

      - name: Corregir compatibilidad gzip Android
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted-project")
          files = list(root.rglob("gz-file-input-stream.hpp"))

          if not files:
              raise SystemExit(
                  "ERROR: No se encontró gz-file-input-stream.hpp"
              )

          fixed = False

          for file in files:
              source = file.read_text()

              old = "gzfread(buffer, 1, size, fFile)"

              new = """gzread(fFile, buffer, static_cast<unsigned int>(size))"""

              if old in source:
                  source = source.replace(
                      "size_t read = " + old + ";",
                      """int gzReadResult = gzread(
              fFile,
              buffer,
              static_cast<unsigned int>(size)
          );
          size_t read = gzReadResult > 0
              ? static_cast<size_t>(gzReadResult)
              : 0;"""
                  )

                  file.write_text(source)
                  print("CORREGIDO:", file)
                  fixed = True

              elif "gzread(fFile" in source:
                  print("El archivo ya utiliza gzread:", file)
                  fixed = True

          if not fixed:
              raise SystemExit(
                  "ERROR: No se encontró la llamada esperada a gzfread."
              )
          PY

      - name: Compilar APK corregido
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          $GRADLE_CMD assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find extracted-project -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK generado: $APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JE2BE-Android-APK
          path: extracted-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
